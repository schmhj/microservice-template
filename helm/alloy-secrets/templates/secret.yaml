apiVersion: v1
kind: Secret
metadata:
  name: grafana-cloud-credentials
  namespace: {{ .Values.namespace | default "monitoring" }}
type: Opaque
stringData:
  MIMIR_USER: {{ .Values.mimirUser | quote }}
  LOKI_USER: {{ .Values.lokiUser | quote }}
  TEMPO_USER: {{ .Values.tempoUser | quote }}
  GRAFANA_TOKEN: {{ .Values.grafanaToken | quote }}
