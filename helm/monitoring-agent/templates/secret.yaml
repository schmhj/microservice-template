apiVersion: v1
kind: Secret
metadata:
  name: grafana-cloud-credentials
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  MIMIR_USER: {{ .Values.secrets.mimirUser | quote }}
  LOKI_USER: {{ .Values.secrets.lokiUser | quote }}
  TEMPO_USER: {{ .Values.secrets.tempoUser | quote }}
  GRAFANA_TOKEN: {{ .Values.secrets.grafanaToken | quote }}
