name: CI/CD Pipeline

# Workflow triggers for different scenarios
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop, main]

# Concurrency to cancel in-progress runs on the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Permissions for GITHUB_TOKEN
permissions:
  contents: write
  packages: write

jobs:
  # 1. Linting and Testing job - runs on PR and push to develop/main
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run unit tests
        run: ./gradlew test

      - name: Run linting (Gradle check)
        run: ./gradlew check

  # 2. Build and push job - runs on PR and push to develop/main
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_ACCESS_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=ref,event=branch

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 3. Release job - runs only on push to main
  release:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for automated tagging logic

      # Automated Semantic Versioning based on commit messages
      - name: Bump version and push tag
        id: tag_version
        uses: anothrNick/github-tag-action@1.64.0
        env:
          GITHUB_TOKEN: ${{ secrets.GHCR_ACCESS_TOKEN }}
          WITH_V: true
          DEFAULT_BUMP: patch
          DEFAULT_TAG: v0.0.1

      # Promote the "SHA" image to "Version" tag without rebuilding (Build Once, Deploy Many)
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_ACCESS_TOKEN }}

      - name: Promote Image to Production Tag
        run: |
          IMAGE_NAME=ghcr.io/${{ github.repository }}
          SOURCE_TAG=${{ needs.build-and-push.outputs.image_tag }}
          TARGET_TAG=${{ steps.tag_version.outputs.new_tag }}

          docker pull $IMAGE_NAME:$SOURCE_TAG
          docker tag $IMAGE_NAME:$SOURCE_TAG $IMAGE_NAME:$TARGET_TAG
          docker tag $IMAGE_NAME:$SOURCE_TAG $IMAGE_NAME:latest
          docker push $IMAGE_NAME:$TARGET_TAG
          docker push $IMAGE_NAME:latest
