server:
  port: 0

spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  docker:
    compose:
      enabled: false

springdoc:
  swagger-ui:
    enabled: false

management:
  tracing:
    sampling:
      probability: 0.0
  otlp:
    metrics:
      export:
        enabled: false
    tracing:
      export:
        enabled: false