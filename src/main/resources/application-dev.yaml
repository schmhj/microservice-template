SERVER_PORT: 8080
SPRING_APPLICATION_NAME: microservice-template
ACTIVE_PROFILE: dev

SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/postgres
SPRING_DATASOURCE_USERNAME: postgres
SPRING_DATASOURCE_PASSWORD: postgres
SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
SPRING_DATASOURCE_MAXIMUM_POOL_SIZE: 10
SPRING_DATASOURCE_MINIMUM_IDLE: 5
SPRING_DATASOURCE_IDLE_TIMEOUT: 30000
SPRING_DATASOURCE_CONNECTION_TIMEOUT: 30000
SPRING_DATASOURCE_VALIDATION_TIMEOUT: 3000
SPRING_JPA_HIBERNATE_DDL_AUTO: update

SQL_INIT_MODE: always
SQL_INIT_PLATFORM: postgresql
FLYWAY_ENABLED: true
FLYWAY_LOCATIONS: classpath:db/migration
FLYWAY_BASELINE_ON_MIGRATE: true
FLYWAY_SCHEMAS: public
FLYWAY_TABLE: flyway_schema_history
FLYWAY_ENCODING: UTF-8

SPRING_DOCKER_COMPOSE_ENABLED: true
SPRINGDOC_SWAGGER_UI_ENABLED: true
