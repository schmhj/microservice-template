server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: ${SPRING_APPLICATION_NAME:microservice-template}
  profiles:
    active: ${ACTIVE_PROFILE:dev}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:testdb}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_MAXIMUM_POOL_SIZE:10}
      minimum-idle: ${SPRING_DATASOURCE_MINIMUM_IDLE:5}
      idle-timeout: ${SPRING_DATASOURCE_IDLE_TIMEOUT:30000}
      connection-timeout: ${SPRING_DATASOURCE_CONNECTION_TIMEOUT:30000}
      pool-name: HikariPool-${SPRING_APPLICATION_NAME:microservice}
      connection-test-query: SELECT 1
      validation-timeout: ${SPRING_DATASOURCE_VALIDATION_TIMEOUT:3000}
      
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:none}

  sql:
    init:
      mode: ${SQL_INIT_MODE:never}
      platform: ${SQL_INIT_PLATFORM:all}

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration}
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:true}
    schemas: ${FLYWAY_SCHEMAS:public}
    table: ${FLYWAY_TABLE:flyway_schema_history}
    encoding: ${FLYWAY_ENCODING:UTF-8}

  docker:
    compose:
      enabled: ${SPRING_DOCKER_COMPOSE_ENABLED:true}
      file: compose.yaml
      lifecyclemanagement: start_and_stop
      readiness:
        tcp:
          connect-timeout: ${SPRING_DOCKER_COMPOSE_READINESS_TCP_CONNECT_TIMEOUT:2s}
          connect-retries: ${SPRING_DOCKER_COMPOSE_READINESS_TCP_CONNECT_RETRIES:3}

springdoc:
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}

management:
  observation:
    annotation:
      enabled: ${SPRING_MANAGEMENT_OBSERVATION_ANNOTATION_ENABLED:true}
  tracing:
    sampling:
      probability: ${SPRING_MANAGEMENT_TRACING_SAMPLING_PROBABILITY:0.1}
  otlp:
    metrics:
      export:
        url: ${SPRING_MANAGEMENT_OTLP_METRICS_EXPORT_URL:http://localhost:4318/v1/metrics}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${SPRING_MANAGEMENT_OTLP_TRACING_EXPORT_ENDPOINT:http://localhost:4318/v1/traces}
    logging:
      export:
        otlp:
          endpoint: ${SPRING_MANAGEMENT_OTLP_LOGGING_EXPORT_ENDPOINT:http://localhost:4318/v1/logs}